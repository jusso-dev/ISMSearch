name: Trivy code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Scan repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action's installer uses get.trivy.dev, which may be unreachable on
      # hosted runners. Fetch the pinned release directly and verify its checksum.
      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          version=0.76.1
          archive="trivy_${version}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o checksums.txt "$base/trivy_${version}_checksums.txt"
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          mkdir -p trivy-bin
          tar -xzf "$archive" -C trivy-bin trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Scan dependencies, secrets, and IaC
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload code scanning results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
